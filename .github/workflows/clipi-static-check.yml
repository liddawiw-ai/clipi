name: Clipi source guard checks
on:
  push:
    branches:
      - feature/clipi-integrated-cloud-rooms
      - feature/clipi-step-by-step-release
      - release/clipi-mvp-beta
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JavaScript dependencies (no native scripts)
        run: npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Validate JSX, Expo config and release guards
        run: npm run test:ci
  firestore-rules-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21 for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JS testing dependencies
        run: npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Test rules in isolated Firebase emulator
        run: npm run test:firestore:emulator
