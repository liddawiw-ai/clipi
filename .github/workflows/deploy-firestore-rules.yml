name: Deploy Clipi Firestore Rules (guarded)
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'First choose preflight. Deployment is a separate explicit operation.'
        required: true
        type: choice
        options:
          - preflight
          - deploy
        default: preflight
      deployment_confirmation:
        description: 'For deploy only: enter DEPLOY-CLIPI-FIRESTORE after checking current live rules'
        required: false
        type: string
        default: ''
permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout immutable tested Clipi revision
        uses: actions/checkout@v4
        with:
          ref: 2da8b069003a5d8dc71da28db0de226c67f4780f
          persist-credentials: false
      - name: Verify pinned rules revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2da8b069003a5d8dc71da28db0de226c67f4780f"
          test -s firestore.rules
          test -f tests/firestore.rules.test.cjs
          test -f firebase.json
          echo "Verified pinned revision and Firestore files."
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java for isolated Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Check Clipi source integrity
        run: npm run test:ci
      - name: Re-run Firestore rules emulator tests
        run: npm run test:firestore:emulator
      - name: Verify Firebase service-account secret is configured
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLIPI }}
        shell: bash
        run: |
          if [ -z "$FIREBASE_CREDENTIALS" ]; then
            echo "::error::Missing GitHub Actions secret FIREBASE_SERVICE_ACCOUNT_CLIPI"
            exit 1
          fi
          echo "Firebase credentials secret is configured (value not printed)."
      - name: Identify target without modifying live Firebase
        run: |
          echo "Preflight passed for project clipi-f67c0 at tested commit 2da8b069003a5d8dc71da28db0de226c67f4780f."
          echo "No Firebase production rules were changed by preflight."

  deploy:
    if: ${{ inputs.operation == 'deploy' }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require explicit deployment confirmation
        env:
          DEPLOY_CONFIRM: ${{ inputs.deployment_confirmation }}
        shell: bash
        run: |
          if [ "$DEPLOY_CONFIRM" != "DEPLOY-CLIPI-FIRESTORE" ]; then
            echo "::error::Deployment not authorized. Run preflight first and verify existing live Firestore rules."
            exit 1
          fi
      - name: Checkout immutable tested Clipi revision
        uses: actions/checkout@v4
        with:
          ref: 2da8b069003a5d8dc71da28db0de226c67f4780f
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy rules to clipi-f67c0 only
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLIPI }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "2da8b069003a5d8dc71da28db0de226c67f4780f"
          test -n "$FIREBASE_CREDENTIALS"
          keyfile="$RUNNER_TEMP/clipi-service-account.json"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$FIREBASE_CREDENTIALS" > "$keyfile"
          export GOOGLE_APPLICATION_CREDENTIALS="$keyfile"
          npx --yes firebase-tools deploy --only firestore:rules --project clipi-f67c0 --non-interactive
