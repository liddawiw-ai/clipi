name: Clipi static validation (no Android build)
on:
  push:
    branches: [feature/clipi-stage7-build-fix]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run syntax and release regression tests
        run: npm run test:ci
      - name: Run Firestore rules tests
        run: npm run test:firestore:emulator
      - name: Report Google Play blockers (expected until approved)
        run: |
          if npm run check:play; then
            echo "Static Play checks passed. Manual approvals and real-device tests still required."
          else
            echo "Release is BLOCKED. See docs/RELEASE_READINESS.md"
          fi
