name: Pi wallet verification
on:
  push:
    branches: [work/pi-host-wallet-link]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: pi-web
      - run: node --test worker/host-wallet-link.test.mjs worker/host-earnings.test.mjs worker/external-checkout.test.mjs
      - run: node build.mjs
        working-directory: pi-web
