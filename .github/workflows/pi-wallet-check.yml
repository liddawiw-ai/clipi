name: Pi wallet verification
on:
  push:
    branches: [work/pi-host-wallet-link]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: pi-web
      - run: node --test worker/*.test.mjs
      - run: node --test tests/*.test.mjs room-invitations.test.mjs
        working-directory: pi-web
      - run: node build.mjs
        working-directory: pi-web
      - run: npm install --prefix "$RUNNER_TEMP/browser-test" playwright-core@1.56.1 --no-audit --no-fund
      - run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser-test/node_modules/playwright-core" node tests/browser/check-playback.mjs
        working-directory: pi-web
