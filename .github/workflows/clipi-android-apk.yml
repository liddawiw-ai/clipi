name: Clipi Android test APK
on:
  workflow_dispatch:
  push:
    branches:
      - review/clipi-android-44-internal
      - work/clipi-android-video-admin
    paths:
      - .github/workflows/clipi-android-apk.yml
      - App.js
      - ShortMedia.js
      - ShortVideoHome.js
      - ShortDraft.js
      - EarningsWalletScreen.js
      - PayoutPicker.js
      - HelpCenter.js
      - scripts/check-installed-video.py
      - app.config.js
      - scripts/check-syntax.cjs
      - scripts/check-release.cjs
      - greedy-clock.mjs
permissions:
  contents: read
env:
  CLIPI_DISTRIBUTION: internal
  EXPO_PUBLIC_FACEBOOK_APP_ID: "1141915368807928"
  EXPO_PUBLIC_FACEBOOK_CLIENT_TOKEN: ${{ secrets.EXPO_PUBLIC_FACEBOOK_CLIENT_TOKEN || vars.EXPO_PUBLIC_FACEBOOK_CLIENT_TOKEN }}
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --no-audit --no-fund
      - run: npm run test:ci
      - run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
      - run: ./gradlew --no-daemon :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
        working-directory: android
      - name: Check APK signing
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs "$apk" > signing.txt
          grep -Fi 'certificate SHA-256 digest: fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c' signing.txt
          cp "$apk" Clipi-Live-Android-46.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Clipi-Live-Android-46
          path: Clipi-Live-Android-46.apk
          if-no-files-found: error
          retention-days: 14
  installed-apk:
    needs: android-apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Clipi-Live-Android-46
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Test the signed APK on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          script: |
            adb shell settings put system screen_off_timeout 900000
            adb shell wm dismiss-keyguard
            adb install -r Clipi-Live-Android-46.apk
            python3 scripts/check-installed-language.py
            python3 scripts/check-installed-video.py
