name: Clipi Android test APK
on:
  workflow_dispatch:
  push:
    branches:
      - release/android-profile-videos-40
    paths:
      - .github/workflows/clipi-android-apk.yml
permissions:
  contents: write
env:
  CLIPI_DISTRIBUTION: internal
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --no-audit --no-fund
      - run: npm run test:ci
      - run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
      - run: ./gradlew --no-daemon :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
        working-directory: android
      - name: Check APK signing
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs "$apk" > signing.txt
          grep -Fi 'certificate SHA-256 digest: fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c' signing.txt
          cp "$apk" Clipi-Android-41.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Clipi-Android-41
          path: Clipi-Android-41.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish signed Android download
        if: github.ref == 'refs/heads/release/android-profile-videos-40'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create android-build41 Clipi-Android-41.apk --target "$GITHUB_SHA" --title "Clipi Android 41" --notes "Short-video settings over playback, room-scoped moderation, microphone and invitation controls, and localized interface messages." --prerelease
