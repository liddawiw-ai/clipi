name: Clipi Android test APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-room-lifecycle-25
    paths:
      - .github/workflows/clipi-android-apk.yml
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --no-audit --no-fund
      - run: npm run test:ci
      - run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
      - run: ./gradlew --no-daemon :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
        working-directory: android
      - name: Check APK signing
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$apksigner" verify "$apk"
          cp "$apk" Clipi-Android-build25.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Clipi-Android-build25
          path: Clipi-Android-build25.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish signed Android download
        if: github.ref == 'refs/heads/feature/android-room-lifecycle-25'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create android-build25 Clipi-Android-build25.apk --target "$GITHUB_SHA" --title "Clipi Android 25" --notes "Live room presence and seat moderation." --prerelease
