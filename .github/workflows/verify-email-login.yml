name: Verify Clipi Android email login
on:
  push:
    branches: [fix/verify-clipi-email-android]
permissions:
  contents: read
jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: curl -fsSL --retry 3 'https://expo.dev/artifacts/eas/Xhp2UjuAgbjQ7XoKmmZ_RIzsf-ec7zAJ0qT0sVjTG5A.apk' -o clipi.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          script: python3 .github/verify-email-login.py
