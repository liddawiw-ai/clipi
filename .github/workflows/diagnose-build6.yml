name: Diagnose Clipi build 6
on:
  push:
    branches: [fix/android-build6-runtime]
permissions:
  contents: read
jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: curl -fsSL 'https://expo.dev/artifacts/eas/pjRfkXIaJjExow1mMArhDIZRqM-M6xwUIoBAi-V3cMc.apk' -o clipi.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          script: adb install clipi.apk && adb logcat -c && adb shell am start -W -n com.walid.clipi/.MainActivity && sleep 12 && adb logcat -d -s ReactNativeJS AndroidRuntime && adb shell dumpsys activity activities | grep mResumedActivity && adb shell pidof com.walid.clipi
