name: Clipi iPhone test IPA

on:
  workflow_dispatch:
  push:
    branches: [feature/clipi-stage7-build-fix]
    paths: [.github/workflows/clipi-ios-ipa.yml]

permissions:
  contents: read

jobs:
  ios-ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check Apple signing configuration
        env:
          CERTIFICATE: ${{ secrets.CLIPI_IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CLIPI_IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.CLIPI_IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          if [[ -z "$CERTIFICATE" || -z "$CERTIFICATE_PASSWORD" || -z "$PROFILE" ]]; then
            echo "::error::Set the three Clipi iOS signing secrets: distribution certificate, certificate password, and Ad Hoc provisioning profile."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate native Xcode project
        run: |
          npx expo prebuild --platform ios --no-install
          pod install --project-directory=ios
        env:
          CI: '1'

      - name: Install signing material and verify the registered-device profile
        env:
          CERTIFICATE: ${{ secrets.CLIPI_IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CLIPI_IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.CLIPI_IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          signing_dir="$RUNNER_TEMP/clipi-ios-signing"
          mkdir -p "$signing_dir"
          printf '%s' "$CERTIFICATE" | base64 -D > "$signing_dir/distribution.p12"
          printf '%s' "$PROFILE" | base64 -D > "$signing_dir/clipi.mobileprovision"
          security cms -D -i "$signing_dir/clipi.mobileprovision" -o "$signing_dir/profile.plist"

          export SIGNING_DIR="$signing_dir"
          python3 - <<'PY'
          import datetime, os, pathlib, plistlib
          folder = pathlib.Path(os.environ["SIGNING_DIR"])
          with (folder / "profile.plist").open("rb") as source:
              profile = plistlib.load(source)
          team = profile["TeamIdentifier"][0]
          bundle = "com.walid.clipi"
          if profile["Entitlements"].get("application-identifier") != f"{team}.{bundle}":
              raise SystemExit("Apple profile must be for " + bundle)
          if (not profile.get("ProvisionedDevices")
                  or profile["Entitlements"].get("get-task-allow")
                  or profile["ExpirationDate"] <= datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None)):
              raise SystemExit("An unexpired Ad Hoc distribution profile with registered devices is required")
          uuid = profile["UUID"]
          for relative in ("Library/MobileDevice/Provisioning Profiles", "Library/Developer/Xcode/UserData/Provisioning Profiles"):
              directory = pathlib.Path.home() / relative
              directory.mkdir(parents=True, exist_ok=True)
              (directory / (uuid + ".mobileprovision")).write_bytes((folder / "clipi.mobileprovision").read_bytes())
          with (folder / "ExportOptions.plist").open("wb") as target:
              plistlib.dump({"method": "release-testing", "signingStyle": "manual", "teamID": team,
                            "signingCertificate": "Apple Distribution", "provisioningProfiles": {bundle: uuid}}, target)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf8") as env:
              print(f"CLIPI_TEAM={team}", f"CLIPI_PROFILE_UUID={uuid}", f"CLIPI_SIGNING_DIR={folder}", sep="\n", file=env)
          PY

          keychain="$signing_dir/build.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing_dir/distribution.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"

      - name: Archive and export signed IPA
        run: |
          set -euo pipefail
          ruby -rxcodeproj - <<'RUBY'
          project = Xcodeproj::Project.open("ios/Clipi.xcodeproj")
          app = project.targets.find { |target| target.product_type == "com.apple.product-type.application" }
          abort "Clipi app target not found" unless app
          app.build_configurations.select { |config| config.name == "Release" }.each do |config|
            config.build_settings.merge!({
              "CODE_SIGN_STYLE" => "Manual",
              "CODE_SIGN_IDENTITY" => "Apple Distribution",
              "DEVELOPMENT_TEAM" => ENV.fetch("CLIPI_TEAM"),
              "PROVISIONING_PROFILE_SPECIFIER" => ENV.fetch("CLIPI_PROFILE_UUID")
            })
          end
          project.save
          RUBY
          xcodebuild -workspace ios/Clipi.xcworkspace -scheme Clipi -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Clipi.xcarchive" archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Clipi.xcarchive" \
            -exportOptionsPlist "$CLIPI_SIGNING_DIR/ExportOptions.plist" -exportPath "$RUNNER_TEMP/clipi-ipa"
          mkdir -p artifacts
          cp "$RUNNER_TEMP"/clipi-ipa/*.ipa artifacts/Clipi-iPhone-test.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Clipi-iPhone-test
          path: artifacts/Clipi-iPhone-test.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/clipi-ios-signing/build.keychain-db" || true
          if [[ -n "${CLIPI_PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$CLIPI_PROFILE_UUID.mobileprovision" \
              "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$CLIPI_PROFILE_UUID.mobileprovision"
          fi
          rm -rf "$RUNNER_TEMP/clipi-ios-signing"
