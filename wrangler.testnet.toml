name = "clipi-pi-testnet"
main = "worker/worker.mjs"
compatibility_date = "2025-10-01"
workers_dev = true
keep_vars = true

[vars]
CLIPI_WEB_ENTRY = "room"
PI_GIFTS_TESTNET = "1"

[build]
command = "npm ci --prefix pi-web --no-audit --no-fund && cd pi-web && node build.mjs"

[assets]
directory = "./pi-web/dist"
binding = "CLIPI_APP"
run_worker_first = true

[[d1_databases]]
binding = "PI_GIFTS_DB"
database_name = "clipi-pi-testnet-gifts"
database_id = "6ba719ff-1708-4151-b6b9-f95f5871cf6b"

[[r2_buckets]]
binding = "SHORT_VIDEOS"
bucket_name = "clipi-testnet-shorts"

[ai]
binding = "AI"
