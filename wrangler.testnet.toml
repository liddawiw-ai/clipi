name = "clipi-pi-testnet"
main = "worker/worker.mjs"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
keep_vars = true

[vars]
CLIPI_WEB_ENTRY = "room"
PI_GIFTS_TESTNET = "1"

[[d1_databases]]
binding = "PI_GIFTS_DB"
database_name = "clipi-pi-testnet-gifts"
database_id = "6ba719ff-1708-4151-b6b9-f95f5871cf6b"

[[r2_buckets]]
binding = "SHORT_VIDEOS"
bucket_name = "clipi-testnet-shorts"

[ai]
binding = "AI"

[build]
command = "npm ci --prefix pi-web --no-audit --no-fund && npm install --prefix worker --no-save --package-lock=false --no-audit --no-fund @stellar/stellar-sdk@17.4.0"

# Rebuild after provisioning the Testnet video bucket.
