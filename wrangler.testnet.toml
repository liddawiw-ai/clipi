name = "clipi-pi-testnet"
main = "worker/worker.mjs"
compatibility_date = "2025-10-01"
workers_dev = true
keep_vars = true

[vars]
CLIPI_WEB_ENTRY = "room"
PI_GIFTS_TESTNET = "1"

[[d1_databases]]
binding = "PI_GIFTS_DB"
database_name = "clipi-pi-testnet-gifts"
database_id = "REPLACE_WITH_TESTNET_D1_DATABASE_ID"
