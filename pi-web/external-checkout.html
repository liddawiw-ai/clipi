<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Clipi · شراء الماس</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f9f4;color:#173e38;font:17px system-ui;min-height:100vh;display:grid;place-items:center;padding:20px}main{width:min(100%,410px);background:#fffefa;border:1px solid #c7d8cd;border-radius:22px;padding:24px}small{color:#815521}h1{font-size:26px}p{line-height:1.65}button,a{display:block;background:#d9f1e5;color:#173e38;border:0;padding:13px 20px;border-radius:12px;text-decoration:none;text-align:center;font:inherit;width:100%;margin:9px 0}button:disabled{opacity:.5}[hidden]{display:none}</style>
<main><small>CLIPI</small><h1>شراء الماس</h1><p id="info" role="status"></p><button id="pay" hidden>تأكيد الدفع بعملة PI</button><a href="clipi://wallet">العودة إلى محفظة كليبي</a></main>
<script src="https://sdk.minepi.com/pi-sdk.js"></script><script>
const id=location.hash.slice(1),info=document.querySelector('#info'),btn=document.querySelector('#pay');
const wallet=document.querySelector('a[href="clipi://wallet"]');
async function api(op,body){
 const response=await fetch('/external-checkout/'+op,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 const data=await response.json();
 if(!response.ok)throw Error(data.error||'تعذّر التحقق من العملية. افتح المحفظة قبل بدء طلب جديد.');
 return data;
}
function paid(diamonds){
 btn.hidden=true;
 info.textContent='تم شحن '+diamonds+' ماسة لحساب كليبي الذي بدأ الطلب.';
}
async function init(){
 if(location.search){
  info.textContent=new URLSearchParams(location.search).has('cancel')?'أُغلقت صفحة الدفع. يمكنك مراجعة رصيدك في المحفظة.':'يمكنك العودة إلى محفظتك للتحقق من الشحن.';
  return;
 }
 if(!/^[0-9a-f-]{36}$/i.test(id)){info.textContent='افتح رابط الشراء من متجر الماس داخل كليبي.';return}
 wallet.href='clipi://wallet?order='+encodeURIComponent(id);
 const quote=await api('quote',{id});
 if(quote.state==='paid'){paid(quote.diamonds);return}
 if(quote.state==='open'&&Date.now()>=quote.expires){info.textContent='انتهى عرض السعر. ارجع إلى كليبي لطلب سعر جديد.';return}
 info.textContent=quote.diamonds+' ماسة مقابل '+quote.amount+' PI ('+quote.dollars+' USD) لحساب كليبي '+(quote.account||'الذي بدأ الطلب')+'.';
 if(!window.Pi){info.textContent+=' افتح هذا الرابط في Pi Browser.';return}
 Pi.init({version:'2.0',sandbox:false});
 btn.hidden=false;
 if(quote.state==='pending')btn.textContent='التحقق من الدفعة السابقة';
 btn.onclick=async()=>{
  if(btn.disabled)return;
  btn.disabled=true;
  try{
   const incomplete=[];
   const {accessToken:token}=await Pi.authenticate(['username','payments'],p=>incomplete.push(p));
   for(const p of incomplete){
    if(!p.transaction?.txid)throw Error('راجع الدفعة السابقة من صفحة الشراء التي بدأت منها.');
    if(p.metadata?.kind==='native_diamonds'){
     await api('complete',{id:p.metadata.order,paymentId:p.identifier,txid:p.transaction.txid,token});
    }else if(p.metadata?.kind==='diamond_pack'){
     const response=await fetch('/pi-gifts/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'diamond_pack',paymentId:p.identifier,txid:p.transaction.txid,accessToken:token})});
     if(!response.ok)throw Error('افتح محفظة نسخة باي لاستعادة دفعة الشحن السابقة.');
    }else throw Error('راجع الدفعة السابقة من صفحة الشراء التي بدأت منها.');
   }
   if(incomplete.length){
    if(incomplete.some(p=>p.metadata?.order===id)){paid(quote.diamonds);return}
    info.textContent='تمت تسوية دفعة سابقة لحسابها الأصلي. اضغط مرة أخرى إذا أردت متابعة الطلب الحالي.';
    btn.disabled=false;return;
   }
   const current=await api('quote',{id});
   if(current.state==='paid'){paid(current.diamonds);return}
   if(current.state==='pending'){
    btn.textContent='التحقق من الدفعة السابقة';
    throw Error('يوجد طلب دفع سابق. ارجع إلى محفظة كليبي للتحقق من حالته قبل الشراء مجددًا.');
   }
   if(Date.now()>=current.expires)throw Error('انتهى السعر. اطلب عرضًا جديدًا من كليبي.');
   await Pi.createPayment({amount:Number(current.amount),memo:'Clipi · '+current.diamonds+' diamonds',metadata:{kind:'native_diamonds',order:id}},{
    onReadyForServerApproval:async paymentId=>{
     try{await api('approve',{id,token,paymentId})}catch(e){info.textContent=e.message}
    },
    onReadyForServerCompletion:async(paymentId,txid)=>{
     try{await api('complete',{id,token,paymentId,txid});paid(current.diamonds)}
     catch(e){info.textContent=e.message;btn.textContent='التحقق من الدفعة السابقة';btn.disabled=false}
    },
    onCancel:()=>{info.textContent='أُلغي الدفع. ارجع إلى كليبي لطلب سعر جديد.';btn.hidden=true},
    onError:()=>{info.textContent='تعذّر إكمال الدفع. افتح محفظة كليبي للتحقق من الرصيد.';btn.disabled=false}
   });
  }catch(e){info.textContent=e.message;btn.disabled=false}
 };
}
init().catch(e=>{info.textContent=e.message});
</script></html>
