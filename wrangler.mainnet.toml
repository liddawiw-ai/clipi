# Deploy this Worker with --config wrangler.mainnet.toml.
name = "clipi-mainnet"
main = "worker/worker.mjs"
compatibility_date = "2025-10-01"
workers_dev = true
keep_vars = true

[vars]
PI_GIFTS_NETWORK = "mainnet"
CLIPI_WEB_ENTRY = "room"

[build]
command = "npm ci --prefix pi-web --no-audit --no-fund && cd pi-web && node build.mjs"

[assets]
directory = "./pi-web/dist"
binding = "CLIPI_APP"
run_worker_first = true

[[d1_databases]]
binding = "PI_GIFTS_DB"
database_name = "clipi-mainnet-gifts"
database_id = "43dfb59b-6af5-4742-85f4-a3d4f983d422"

[previews]

[[r2_buckets]]
binding = "SHORT_VIDEOS"
bucket_name = "clipi-mainnet-shorts"
