# Deploy this Worker with --config wrangler.mainnet.toml.
name = "clipi-mainnet"
main = "worker/worker.mjs"
compatibility_date = "2025-10-01"
workers_dev = true
keep_vars = true

[vars]
PI_GIFTS_NETWORK = "mainnet"
CLIPI_WEB_ENTRY = "room"

[build]
command = "npm ci --prefix pi-web --no-audit --no-fund && cd pi-web && node build.mjs"

[assets]
directory = "./pi-web/dist"
binding = "CLIPI_APP"
run_worker_first = true

[[d1_databases]]
binding = "PI_GIFTS_DB"
database_name = "clipi-mainnet-gifts"
database_id = "43dfb59b-6af5-4742-85f4-a3d4f983d422"

[[durable_objects.bindings]]
name = "CLIP_MEDIA"
class_name = "ClipiVideo"

[[migrations]]
tag = "clipi-media-v1"
new_sqlite_classes = ["ClipiVideo"]

[previews]

# The production account manages the optional SHORT_VIDEOS upload bucket.
# Keep that binding across releases, including releases before it is enabled.
[unsafe.metadata]
keep_bindings = ["plain_text", "json", "secret_text", "secret_key", "r2_bucket"]
